services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leasing
      POSTGRES_PASSWORD: leasing
      POSTGRES_DB: leasing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leasing -d leasing"]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://leasing:leasing@postgres:5432/leasing
      ENV_ADMIN_TOKEN: dev-admin-token
      PERSONA_MODE: scripted
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  pgdata:
